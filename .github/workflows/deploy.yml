name: deploy

# Publication GitHub Pages du site statique Suture (branche main uniquement).
# Hors PR : le budget CI de 5 minutes ne s'applique qu'aux pull requests.
#
# Le job tourne sur ubuntu-latest depuis le 17/11 : les déploiements du
# 13 au 17/11 ont échoué ou attendaient un exécuteur self-hosted éteint
# (pnpm introuvable sur le r630, poste suture-pc hors ligne) — la chaîne
# d'outil est maintenant installée par pnpm/action-setup + setup-node,
# comme les jobs `ci` et `recette`.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Groupe « pages-publish » et non « pages » : le 17/11 un run anterior,
  # lance avec l'ancien executeur self-hosted, etait reste en file dans le
  # groupe « pages » sans pouvoir demarrer (poste suture-pc eteint) et
  # bloquait toute publication. Un groupe dedie laisse ces runs orphelins
  # sans jamais empecher la publication en cours.
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10 # hors PR : installation + build + publication (justifié)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Dépendances + build
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile --prefer-offline
          else
            pnpm install
          fi
          pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
